name: Deploy Dioxus App to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout repo
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Install Rust
      # =========================
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # =========================
      # 3. Cache Cargo (faster builds)
      # =========================
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # =========================
      # 4. Install Dioxus CLI (MATCHING VERSION)
      # =========================
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.6.3 --locked

      # =========================
      # 5. Build Dioxus Web App
      # IMPORTANT: workspace package specified
      # =========================
      - name: Build Dioxus app
        run: dx build --release --package kolohub-web

      # =========================
      # 6. Detect output folder (safe fallback)
      # =========================
      - name: Locate build output
        run: |
          echo "Scanning build output..."
          ls -R .

          if [ -d "dist" ]; then
            echo "OUTPUT_DIR=dist" >> $GITHUB_ENV
          elif [ -d "target/dx" ]; then
            echo "OUTPUT_DIR=target/dx" >> $GITHUB_ENV
          else
            echo "OUTPUT_DIR=." >> $GITHUB_ENV
          fi

      # =========================
      # 7. Install Vercel CLI
      # =========================
      - name: Install Vercel CLI
        run: npm install -g vercel

      # =========================
      # 8. Deploy to Vercel
      # =========================
      - name: Deploy to Vercel (Production)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes $OUTPUT_DIR
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
